[package]
name = "signalflow-bot"
version = "0.4.0"
edition = "2021"
description = "SignalFlow Trading Bot — Rule-based Hyperliquid perp bot with orderbook, orderflow, funding, TA, and risk management"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "sync"] }

# HTTP client (rustls for PRoot compatibility)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# WebSocket (rustls for PRoot compatibility)
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Async utilities
futures-util = "0.3"

# Cryptography & Signing (EIP-712 for Hyperliquid)
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Decimal precision for prices/sizes
rust_decimal = { version = "1", features = ["serde-with-str"] }

# Config
toml = "0.8"

# Time
chrono = "0.4"

# Logging (as requested: log + env_logger)
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"
thiserror = "2"

# Async trait support (for TradeStore trait)
async-trait = "0.1"

# SQLite database (for trade journal + lesson engine)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
