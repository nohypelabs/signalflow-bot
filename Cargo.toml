[package]
name = "signalflow-bot"
version = "0.3.0"
edition = "2021"
description = "SignalFlow Auto-Trade Bot - High-performance signal-to-execution on Hyperliquid"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "sync"] }

# HTTP client (rustls for PRoot compatibility)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# WebSocket (rustls for PRoot compatibility)
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Async utilities
futures-util = "0.3"

# Cryptography & Signing
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment variables
dotenvy = "0.15"

# Error handling
anyhow = "1"
thiserror = "2"

# Database (SQLite via SQLx — swap to "postgres" for Supabase migration)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
async-trait = "0.1"

# Performance
bytes = "1"
arc-swap = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
