# SignalFlow Bot v0.4.0 — Example Configuration
# Copy this file to config.toml and fill in your values
# cp config.example.toml config.toml

[wallet]
# Your Ethereum private key (32 bytes, hex encoded)
# IMPORTANT: Never share or commit this!
# You can also set via env: SIGNALFLOW_PRIVATE_KEY
private_key = "0x_YOUR_PRIVATE_KEY_HERE"

[hyperliquid]
# Hyperliquid API endpoints
base_url = "https://api.hyperliquid.xyz"
ws_url = "wss://api.hyperliquid.xyz/ws"

# Testnet (for testing):
# base_url = "https://api.hyperliquid-testnet.xyz"
# ws_url = "wss://api.hyperliquid-testnet.xyz/ws"

[trading]
# Trading pair (coin name on Hyperliquid, e.g. SPX, SOL, ETH, BTC)
pair = "SPX"

# Account equity in USD for position sizing
account_size_usd = 4000.0

# Minimum position size in USD (used for depth filter)
min_position_usd = 50.0

# Funding rate poll interval (seconds)
funding_poll_secs = 30

# OHLCV poll interval (not used — candles built from WS trades)
ohlcv_poll_secs = 60

# Dry run mode — set false to execute real orders
dry_run = true

# Maximum leverage (SPX max 8x, SOL/ETH up to 20x)
max_leverage = 8

[risk]
# Risk per trade as fraction of equity (0.0075 = 0.75%)
risk_per_trade = 0.0075

# ATR multiplier for stop loss distance
atr_sl_mult = 1.5

# Take profit = tp_mult * SL distance
tp_mult = 2.5

# Maximum concurrent open positions (1 for focused single-pair trading)
max_open_positions = 1

# Maximum daily loss in USD before halting
max_daily_loss_usd = 35.0

# Maximum weekly loss in USD before halting
max_weekly_loss_usd = 100.0

# Maximum total exposure in USD
max_total_exposure_usd = 200.0

# Equity curve protection — stop trading if drawdown exceeds threshold
equity_curve_protection = true
equity_dd_threshold_pct = 8.0

[filters]
# ATR volatility filter — skip trade if ATR too high or too low
# max_atr_pct: skip if ATR > this % of price (too volatile)
# min_atr_pct: skip if ATR < this % of price (too quiet)
max_atr_pct = 2.0
min_atr_pct = 0.1

# Session filter — prefer trading during specific hours
# Reduces score for trades outside preferred session
session_filter_enabled = true
session_penalty = 15     # points deducted from score outside session
session_start_utc = 13   # start of preferred session (UTC hour)
session_end_utc = 21     # end of preferred session (UTC hour)
